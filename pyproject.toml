[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search-compare"
version = "0.1.0"
description = "Budgeted, held-out comparison of upstream AFlow and ADAS"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "pydantic>=2", "scipy", "openai>=1", "tree-sitter", "tree-sitter-python"]

[project.optional-dependencies]
agentdojo = ["agentdojo==0.1.35"]

[project.scripts]
search-compare = "searchlab.cli:main"

[tool.setuptools.packages.find]
include = ["searchlab*"]
